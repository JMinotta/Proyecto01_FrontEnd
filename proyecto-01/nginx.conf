server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para optimizar el rendimiento y transferencias de red
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Enrutamiento para aplicaciones SPA (Redirige todo a index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché a largo plazo para recursos estáticos para acelerar visitas consecutivas
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Prevenir acceso a archivos ocultos (como .env o carpetas .git)
    location ~ /\. {
        deny all;
    }
}
